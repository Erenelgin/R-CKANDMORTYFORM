<!DOCTYPE html>
<html lang='tr'>
 <head>
  <meta charset='UTF-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <style>
     *{
       margin:0px;
       padding:0px;
       box-sizing:border-box;


     }

     .container,body, html{
        height:100%;

     }

    @keyframes slide{
      from{
         opacity:0; 
         transform:translateX(-20px);

       }


      to{
         opacity:1; 
         transform:translateX(0);

       }


     

    }

    body{
      background-color:#121212;
     


     }

    label{
      color: #f8fafc; 
      font-size:20px;
      

    }

    h1{
     color: #f8fafc;

     }




    form{
      width:300px;
      height:440px;
      border:none;
      padding:16px;
      border-radius:10px 20px;
      text-align:center;
      animation-name:slide;
      animation-duration:4s;
      background-color: rgba(5, 10, 25, 0.65); 
      color: #e0f2fe;
      
      
      
     }


     .form-item{

        margin-top:5px;
        border:none;
        border-radius:10px;
        color: #ffffff;
        background-color: rgba(15, 23, 42, 0.5);
        width:99%;
        height:9%;



      }

      textarea{
        margin-top:15px;
        background-color: rgba(15, 23, 42, 0.5);
        color: #ffffff;
        border-radius:12px;
        width:99%;
        height:9%;
        border:none;

       }
     
      .buton{
        width:30%;
        height:10%;
        padding:5px;
        border:none;
        margin-top:8px;
        border-radius:17px;
        box-shadow:2px 2px 2px black;
        background-color: rgba(30, 41, 59, 0.6);
        color: #ffffff;


       }


       .buton:hover{
         background: linear-gradient(135deg, #0369a1, #0284c7);
  
         box-shadow: 0 0 20px  rgba(56, 189, 248, 0.7);


       }

      .container{
        display:flex;
        justify-content:center;
        align-items:center;
        background-image:url('images1.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;


       }


       

       .form-item:hover, textarea:hover{
          box-shadow:2px 2px 2px #8b5cf6;

        }

 

       
  </style>

  
  
 </head>
 <body>
 <div class='container'>
  <form action='index.html' method='POST'>  
      <h1 id='baslik'>Contact Us</h1>
      <br>

     <label for='username'>Kullanıcı adı:</label>
     <br>
     <input type='text' id='usernam' class='form-item'>
     <br>
     <label for='Email'>E-mail</label>
     <br>
     <input type='email' id='Email' class='form-item'>
     <br>
     
     <label for='pass'>Şifre:</label>
     <br>
     <input type='password' id='pass' class='form-item'>
     
     <br>
     <label for='text'>Mesaj:</label>
     <textarea id='text'></textarea>
     <br>
     <input type='button'value='Gönder' class='buton' id='buton1'>
     <input type='reset' class='buton' id='buton2'>

     <br><br>
     <i>Heasbınız yok mu? <a href='form2.html'>Kayıt ol</a></i>
    
 
  </form>

 </div>
 <script>
   document.getElementById('baslik').textContent = 'Giriş Yap';
  
   usernam = document.getElementById('usernam');
   Email = document.getElementById('Email');
   pass = document.getElementById('pass');
   buton1 = document.getElementById('buton1');

   let unam;
   let emaiL;
   let passwd;

   buton1.onclick = function(){

          unam = usernam.value;
          emaiL = Email.value;
          passwd = pass.value;

         
 
         
         if(unam == ""){
               
               window.alert('KULLANICI ADI GİRMEDİNİZ');

            }

         else if(emaiL == ""){
           
               window.alert('EPOSTA GİRMEDİNİZ');


            }


         else if(passwd == ""){
  
               window.alert('ŞİFRE GİRMEDİNİZ');

            }

          else{

             window.alert('TEKRAR HOŞGELDİN AHBAP');


            }


     }
   
   
   
    



 </script>
 </body>
</html>
