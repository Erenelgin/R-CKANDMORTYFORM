<!DOCTYPE html>
<html lang='tr'>
 <head>
  <meta charset='UTF-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <style>
     *{
       margin:0px;
       padding:0px;
       box-sizing:border-box;


     }

     .container,body, html{
        height:100%;

     }

    @keyframes slide{
      from{
         opacity:0; 
         transform:translateX(-20px);

       }


      to{
         opacity:1; 
         transform:translateX(0);

       }


     

    }

    body{
      background-color:#121212;


     }

    label{
      color:#f8fafc;
      font-size:20px;
      

    }

    h1{
     color:#f8fafc;

     }




    form{
      width:80%;
      height:96%;
      border:none;
      padding:16px;
      border-radius:10px 20px;
      text-align:center;
      animation-name:slide;
      animation-duration:4s;
      background-color: rgba(5, 10, 25, 0.65);
      color: #e0f2fe;
      
      
      
     }


     .form-item{

        margin-top:5px;
        border:none;
        border-radius:10px;
        color:#e4e4e7;
        background-color: rgba(15, 23, 42, 0.5);
        width:99%;
        height:9%;



      }

      #number{
        margin-top:15px;
        background-color: rgba(15, 23, 42, 0.5);
        color:#e4e4e7;
        border-radius:12px;
        width:99%;
        height:9%;
        border:none;

       }
     
      .buton{
        width:30%;
        height:10%;
        padding:5px;
        border:none;
        background-color: rgba(30, 41, 59, 0.6);
        margin-top:8px;
        border-radius:17px;
        box-shadow:2px 2px 2px black;
        color:#e4e4e7;


       }


       .buton:hover{
         background: linear-gradient(135deg, #0369a1, #0284c7);
 
         box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);


       }

      .container{
        display:flex;
        justify-content:center;
        align-items:center;
        background-image:url('images1.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;


       }


       

       .form-item:hover, #number:hover{
          box-shadow:2px 2px 2px #8b5cf6;

        }

       
  </style>

  
  
 </head>
 <body>
 <div class='container'>
  <form action='index.html' method='POST'>  
      <h1 id='baslik'>Contact Us</h1>
      <br>

     <label for='ad'>Ad Ve Soy Ad:</label>
     <br>
     <input type='text' id='ad' class='form-item'>
     <br>
     <label for='Kad'>Kullanıcı Adı:</label>
     <br>
     <input type='text' id='kad' class='form-item'>
     <br>
     
     <label for='email'>E-mail:</label>
     <br>
     <input type='email' id='email' class='form-item'>
     <br>
     <label for='sifre'>Şifre:</label>
     <br>
     <input type='password' id='sifre' class='form-item'>


      <br>

     <label for='text'>Yaş:</label>
     <input type='number' id='number'>
     <br>
     <input type='button' class='buton' id='buton1' value='Gönder'>
     <input type='reset' class='buton' id='buton2'>

    <br><br>

    <i>Zaten hesabınız var mı? <a href='index.html'>Giriş yap</a></i>
    
 
  </form>

 </div>
 <script>
   document.getElementById('baslik').textContent = 'Kayıt Ol';

   ad = document.getElementById('ad');
   kad = document.getElementById('kad');
   email = document.getElementById('email');
   sifre = document.getElementById('sifre');
   number = document.getElementById('number');
   buton1 = document.getElementById('buton1');

   let AD;
   let Kad;
   let Email;
   let Sifre;
   let Num;
   
  
   
   buton1.onclick = function(){
      AD = ad.value;
      Kad = kad.value;
      Email = email.value;
      Sifre = sifre.value;
      Num = number.value;
      


      if(AD == ""){
           window.alert('AD SOYAD GİRMEDİN');


       }

       else if(Kad == ""){
           window.alert('KULLANICI ADI GİRMEDİN');

       }

       else if(Email == ""){
           window.alert('EPOSTA GİRMEDİN');


       }

       else if(Sifre == ""){
           window.alert('ŞİFRE GİRMEDİN');

        }

       else if(Num == ""){
           window.alert('YAŞ GİRMEDİN');


        }

       else{
          Num = Number(Num);

          if(Num >= 110){
              window.alert('YAŞ ÇOK FAZLA');


           }
         
          else if(Num >= 18){
              window.alert('HOŞGELDİNİZ RİCK VE MORTY 100. YIL SONSUZA DEK...');
           }

          else if(Num < 0){
              window.alert('NEGATİF YAŞ MI OLUR LAN!!!');


           }

          else{
             window.alert('BÜYÜ DE GEL');


            }


        }

       

      


    }

   
  
 </script>
 </body>
</html>
